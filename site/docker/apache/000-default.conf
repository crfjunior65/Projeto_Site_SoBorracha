<VirtualHost *:80>
    ServerAdmin webmaster@soborracha.local
    DocumentRoot /var/www/html/public
    ServerName soborracha.local
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Configurações do diretório principal
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
        
        # Configurações de segurança
        <Files "*.php">
            Require all granted
        </Files>
    </Directory>
    
    # Alias para o admin
    Alias /admin /var/www/html/admin
    <Directory /var/www/html/admin>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php login.php
        
        # Proteger arquivos sensíveis
        <Files "*.log">
            Require all denied
        </Files>
        
        <Files "*.sql">
            Require all denied
        </Files>
    </Directory>
    
    # Proteger diretório config
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    
    # Proteger diretório database
    <Directory /var/www/html/database>
        Require all denied
    </Directory>
    
    # Proteger diretório docker
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>
    
    # Rewrite rules
    RewriteEngine On
    
    # Configurações básicas de cache (sem mod_expires)
    <IfModule mod_headers.c>
        # Cache para assets estáticos
        <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
            Header set Cache-Control "max-age=2592000, public"
        </FilesMatch>
        
        # CORS para desenvolvimento
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    </IfModule>
    
    # Compressão GZIP
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>
</VirtualHost>
