version: '3.8'

services:
  # Servidor Web PHP + Apache
  web:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: soborracha_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=soborracha_db
      - DB_USER=soborracha_user
      - DB_PASS=soborracha_pass
    # Credenciais SMTP e demais segredos vêm do arquivo .env (não versionado).
    # As chaves esperadas estão documentadas em .env.example.
    env_file:
      - .env
    networks:
      - soborracha_network
    restart: unless-stopped

  # Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: soborracha_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: soborracha_db
      MYSQL_USER: soborracha_user
      MYSQL_PASSWORD: soborracha_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-structure.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - soborracha_network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin para gerenciar o banco
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: soborracha_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: soborracha_user
      PMA_PASSWORD: soborracha_pass
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - soborracha_network
    restart: unless-stopped

  # Redis para cache (opcional)
  redis:
    image: redis:7-alpine
    container_name: soborracha_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - soborracha_network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  soborracha_network:
    driver: bridge
